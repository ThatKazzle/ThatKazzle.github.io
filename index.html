<!DOCTYPE html>
<link rel="stylesheet" href="styles.css?v=3">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL DASHBOARD</title>
    <link rel="icon" type="image/svg" href="icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script defer src="app.js?v=3"></script>
</head>
<body>
    <div class="shell">
        <div class="header">
            <div class="header-top">
                <span class="header-title">Finances</span>
                <span class="header-status">
                    <span class="status-dot"></span>
                    ONLINE
                </span>
            </div>
            <div class="header-sub">SESSION_ID: A3F9-22B1 &nbsp;·&nbsp; 04.30.2026</div>
            <div class="prompt-line">
                root@dashboard:~$ <span class="cursor"></span>
            </div>
        </div>
        
        <div class="stat" style="text-align: center;">
            <select id="DateSelection" style="margin: 4%">
            //Code adds these options here
        </select>
            <div class="stat-label">Paycheck</div>
            <div class="stat-value sm" style="font-size: 64px" id="paycheckAmount"></div>
            <div class="stat-unit">USD</div>
        </div>
        <div class="section-label">// Big Numbers</div>
        <div class="grid-2">
            <div class="stat">
                <div class="stat-label">Withdrawals:</div>
                <div class="stat-value sm" id="withdrawalAmount">0</div>
                <div class="stat-unit">USD</div>
                <label class="term-check" style="margin-top: 10%;">
                    <input type="checkbox" id="autoscan">
                    <span class="check-ui"></span>
                    <span class="check-text">AUTO SCAN</span>
                </label>
            </div>
            <div class="stat">
                <div class="stat-label">Bills to stay:</div>
                <div class="stat-value sm" id="variableExpenses">0</div>
                <div class="stat-unit">Keep this in your account, this is monthly fixed expenses that aren't in cash</div>
            </div>
        </div>
    </div>
    
</body>
